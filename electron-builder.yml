# Minimal configuration for an unsigned build. Prompt 11 adds signed installers and auto-update.
appId: io.github.briandilley.shifted
productName: Shifted
directories:
  buildResources: build
  output: dist
files:
  - 'out/**/*'
  - 'resources/**/*'
  - 'package.json'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # macOS asks once for the camera and the microphone, and shows these reasons.
  extendInfo:
    NSCameraUsageDescription: A Gmail or Calendar page asks to use the camera, for example in a Google Chat huddle.
    NSMicrophoneUsageDescription: A Gmail or Calendar page asks to use the microphone, for example in a Google Chat huddle.
win:
  executableName: Shifted
linux:
  target:
    - AppImage
  category: Network
npmRebuild: false
# The Electron fuses of "Security" in docs/spec/BUILD.md. electron-builder flips them in
# the packaged executable right before it signs the app, and writes the asar integrity
# hash for macOS and Windows. `resetAdHocDarwinSignature` keeps an unsigned build for Apple
# silicon able to start: flipping a fuse breaks the ad hoc signature of the executable.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
# Shifted can be the default email app. electron-builder declares the `mailto:` scheme in
# the macOS Info.plist, the Linux desktop file, and the Windows installer.
protocols:
  - name: Email
    schemes:
      - mailto
