<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Shifted</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A78"/>
      <stop offset="0.55" stop-color="#14205A"/>
      <stop offset="1" stop-color="#0B1236"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#3B5BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3B5BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#12B5CB"/>
    </linearGradient>
    <linearGradient id="middle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#A142F4"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8ECF8"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#A142F4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Tile on the macOS icon grid: 824 x 824 with a 100 px margin. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>

  <!-- Three mail cards, each shifted down and right from the one behind it. -->
  <rect x="202" y="262" width="520" height="364" rx="58" fill="url(#back)" filter="url(#shadow)"/>
  <rect x="252" y="322" width="520" height="364" rx="58" fill="url(#middle)" filter="url(#shadow)"/>
  <g filter="url(#shadow)">
    <rect x="302" y="382" width="520" height="364" rx="58" fill="url(#front)"/>
  </g>
  <path d="M356 446 L562 592 L768 446" fill="none" stroke="url(#flap)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Unread dot. -->
  <circle cx="826" cy="378" r="74" fill="#0B1236"/>
  <circle cx="826" cy="378" r="58" fill="#FF4D4F"/>
</svg>
