# Runs the unit tests and the end-to-end tests of Shifted on macOS, Windows, and Linux.
# See "Three platforms" in docs/spec/prompts/09-hardening.md.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the packages
        run: npm ci

      # Electron's Chromium sandbox needs unprivileged user namespaces. Ubuntu 24.04 turns
      # them off for programs without an AppArmor profile. `xvfb-run` gives Electron a
      # display, and D-Bus gives it a session bus. Electron shows notifications on Linux
      # with libnotify, which every Linux desktop has but the runner does not. Without it,
      # `Notification.isSupported()` is false.
      - name: Prepare Linux for Electron
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libnotify4

      - name: Unit tests
        run: npm test

      - name: Type check and lint
        run: |
          npm run typecheck
          npm run lint

      - name: End-to-end tests (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: End-to-end tests (Linux, under xvfb-run)
        if: runner.os == 'Linux'
        run: |
          npm run build
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" dbus-run-session -- npx playwright test

      - name: Keep the end-to-end results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
